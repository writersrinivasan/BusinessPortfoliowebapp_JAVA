<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Selection Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .slot-label {
            display: block;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fff;
            text-align: center;
            font-weight: 500;
            color: #495057;
            text-decoration: none;
            user-select: none;
            position: relative;
        }

        .slot-label:hover {
            background-color: rgba(13, 110, 253, 0.1);
            border-color: #0d6efd;
            color: #0d6efd;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .slot-radio:checked + .slot-label,
        .slot-label.selected-slot {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
            transform: translateY(-2px);
        }

        .slot-radio {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .form-check {
            margin-bottom: 0;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Slot Selection Test</h2>
        <p>Test the slot selection functionality. Click on any time slot to select it.</p>
        
        <form id="test-form">
            <div class="row" id="slots-grid">
                <div class="col-md-4 col-sm-6 mb-2">
                    <div class="form-check">
                        <input class="form-check-input slot-radio" 
                               type="radio" 
                               name="slot" 
                               value="09:00 AM" 
                               id="slot-1"
                               required
                               style="display: none;">
                        <label class="form-check-label slot-label" 
                               for="slot-1"
                               onclick="selectSlot('09:00 AM', 1)">
                            <i class="bi bi-clock"></i> 09:00 AM
                        </label>
                    </div>
                </div>
                
                <div class="col-md-4 col-sm-6 mb-2">
                    <div class="form-check">
                        <input class="form-check-input slot-radio" 
                               type="radio" 
                               name="slot" 
                               value="10:00 AM" 
                               id="slot-2"
                               required
                               style="display: none;">
                        <label class="form-check-label slot-label" 
                               for="slot-2"
                               onclick="selectSlot('10:00 AM', 2)">
                            <i class="bi bi-clock"></i> 10:00 AM
                        </label>
                    </div>
                </div>
                
                <div class="col-md-4 col-sm-6 mb-2">
                    <div class="form-check">
                        <input class="form-check-input slot-radio" 
                               type="radio" 
                               name="slot" 
                               value="11:00 AM" 
                               id="slot-3"
                               required
                               style="display: none;">
                        <label class="form-check-label slot-label" 
                               for="slot-3"
                               onclick="selectSlot('11:00 AM', 3)">
                            <i class="bi bi-clock"></i> 11:00 AM
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="mt-3">
                <button type="button" onclick="checkSelected()" class="btn btn-primary">Check Selected Slot</button>
                <button type="submit" class="btn btn-success">Submit Form</button>
            </div>
            
            <div id="result" class="mt-3"></div>
        </form>
    </div>
    
    <script>
        function selectSlot(slotValue, slotIndex) {
            console.log('selectSlot called with:', slotValue, slotIndex);
            
            // Find and check the corresponding radio button
            const radioButton = document.getElementById(`slot-${slotIndex}`);
            if (radioButton) {
                radioButton.checked = true;
                console.log('Radio button checked:', radioButton.checked);
                
                // Trigger change event
                const changeEvent = new Event('change', { bubbles: true });
                radioButton.dispatchEvent(changeEvent);
                
                // Update visual feedback
                updateSelectedSlot(slotValue);
            } else {
                console.error('Radio button not found for slot:', slotIndex);
            }
        }
        
        function updateSelectedSlot(slot) {
            // Update visual feedback for selected slot
            const labels = document.querySelectorAll('.slot-label');
            labels.forEach(label => {
                label.classList.remove('selected-slot');
            });
            
            const selectedLabel = document.querySelector(`input[value="${slot}"] + label`);
            if (selectedLabel) {
                selectedLabel.classList.add('selected-slot');
            }
        }
        
        function checkSelected() {
            const selectedSlot = document.querySelector('input[name="slot"]:checked');
            const result = document.getElementById('result');
            
            if (selectedSlot) {
                result.innerHTML = `<div class="alert alert-success">✅ Selected slot: <strong>${selectedSlot.value}</strong></div>`;
            } else {
                result.innerHTML = `<div class="alert alert-warning">⚠️ No slot selected</div>`;
            }
        }
        
        // Form submission test
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const selectedSlot = document.querySelector('input[name="slot"]:checked');
            const result = document.getElementById('result');
            
            if (selectedSlot) {
                result.innerHTML = `<div class="alert alert-success">🎉 Form would submit with slot: <strong>${selectedSlot.value}</strong></div>`;
            } else {
                result.innerHTML = `<div class="alert alert-danger">❌ Form validation failed - no slot selected</div>`;
            }
        });
        
        // Add change event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const slotRadios = document.querySelectorAll('.slot-radio');
            slotRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    console.log('Slot changed to:', this.value);
                    updateSelectedSlot(this.value);
                });
            });
        });
    </script>
</body>
</html>
